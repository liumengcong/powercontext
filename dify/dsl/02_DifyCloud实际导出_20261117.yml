    - data:
        code: "import json\nimport re\nimport uuid\n\ndef main(player_key: str, action:\
          \ str, message: str) -> dict:\n    key = (player_key or \"\").strip()\n\
          \    if not re.fullmatch(r\"[A-Za-z0-9_-]{8,64}\", key):\n        raise\
          \ ValueError(\"player_key 请填 8—64 位字母、数字、下划线或短横线；回访时使用同一个值。\")\n    message\
          \ = (message or \"\").strip()\n    if len(message) > 240:\n        raise\
          \ ValueError(\"message 最多 240 字；寄存物品名称最多 120 字。\")\n    payload = {\"player_key\"\
          : key, \"action\": action, \"message\": message, \"request_id\": str(uuid.uuid4())}\n\
          \    return {\"request_body\": json.dumps(payload, ensure_ascii=False)}\n"
        code_language: python3
        desc: ''
        outputs:
          request_body:
            children: null
            type: string
