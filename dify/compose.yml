services:
  lost-found:
    build: .
    environment:
      BACKEND_TOKEN: ${BACKEND_TOKEN:?Run python scripts/setup.py first}
      DATA_DIR: /data
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - lost-found-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 20s
volumes:
  lost-found-data:
